<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="circle1"></div>
   <div class="circle2"></div>
   <div class="container">
    <div class="left">
        <div class="logo">
            sign up!
        </div>
        <h1> 
            JOIN WITH US
        </h1>
        <p> 
          Create your account and become a part of this website. Discover new possibilitiesand connect with people. 
        </p>
    </div>
    <div class="right">
        <h2>
            Create Account
        </h2>
        <p class="subtitle">
            Sign up to get started
        </p>
        <form>
            <div class="input-box">
                <label>
                    Full name
                </label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            <div class="input-box">
                <label>
                    Email Address
                </label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="input-box">
                <label>
                    Password
                </label>
                <input type="password" placeholder="Create a password" required>
            </div>
            <div class="input-box">
                <label>
                    Confirm Password
                </label>
                <input type="password" placeholder="Confirm your password" required>
            </div>
            <div class="terms">
                <input type="checkbox" required>
                <span>
                    I agree to
                    <a href="#">
                        Terms & Conditions 
                    </a>
                </span>
            </div>
            <button type="submit" class="signup-btn">
                Create Account
            </button>
        </form>
        <div class="login">
            Already have an Account?
            <a href="#"> Login</a>
        </div>
    </div>
   </div>
</body>
</html>
